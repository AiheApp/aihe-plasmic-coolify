name: Build and Push Plasmic Docker Image

on:
  push:
    branches: [ master, main, luis-test ]
  pull_request:
    branches: [ master, main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/plasmic

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.ci
        platforms: linux/amd64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          USERNAME=AiheApp
          REPO_NAME=aihe-plasmic-coolify
          GIT_BRANCH=${{ github.ref_name }}
          DB_HOST_ARG=db
          DB_USER_ARG=wab
          DB_PASSWORD_ARG=plasmic
          DB_NAME_ARG=wab
          DB_PORT_ARG=5432
          NODE_OPTIONS=--max-old-space-size=6144

    - name: Output image tags
      run: echo "Built and pushed images with tags: ${{ steps.meta.outputs.tags }}"
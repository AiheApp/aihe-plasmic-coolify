services:
  # Database Service - Optimized for 16GB VM
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: wab
      POSTGRES_PASSWORD: plasmic
      POSTGRES_DB: wab
      # Memory optimizations for 16GB VM
      POSTGRES_SHARED_BUFFERS: 256MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 2GB
      POSTGRES_MAX_CONNECTIONS: 50
      POSTGRES_WORK_MEM: 8MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wab -d wab"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - plasmic-net
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'

  # NPM Registry Service - Optional, can be removed to save resources
  verdaccio:
    image: verdaccio/verdaccio:5
    restart: always
    environment:
      VERDACCIO_PORT: "4873"
    volumes:
      - verdaccio_storage:/verdaccio/storage
      - verdaccio_conf:/verdaccio/conf
    networks:
      - plasmic-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # Plasmic Application - Uses Pre-built Image from GitHub Container Registry
  plasmic-app:
    image: ghcr.io/aiheapp/aihe-plasmic-coolify/plasmic:latest
    restart: always
    depends_on:
      db:
        condition: service_healthy
      verdaccio:
        condition: service_started
    environment:
      NODE_ENV: production
      # Memory optimization - reduced from 8192MB to 3072MB (3GB)
      NODE_OPTIONS: "--max-old-space-size=3072 --max-semi-space-size=256"
      
      # Database configuration
      PGHOST: db
      PGPORT: 5432
      PGUSER: wab
      PGPASSWORD: plasmic
      PGDATABASE: wab
      WAB_DBNAME: wab
      WAB_PASSWORD: plasmic
      
      # Application configuration
      SESSION_SECRET: "${SESSION_SECRET:-your-secure-session-secret-change-this-in-production}"
      
      # Coolify will handle domains and SSL
      # Remove or comment out in production and set via Coolify environment variables
      # APP_URL: "${SERVICE_FQDN_PLASMIC_APP}"
      # DATABASE_URL: "postgresql://wab:plasmic@db:5432/wab"
      
    volumes:
      - app_logs:/app/logs
    networks:
      - plasmic-net
    deploy:
      resources:
        limits:
          memory: 12G  # Most of the 16GB VM (leaving 4GB for system + DB)
          cpus: '6.0'
        reservations:
          memory: 6G
          cpus: '3.0'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s  # Allow extra time for complex startup

# Networks
networks:
  plasmic-net:
    driver: bridge

# Volumes
volumes:
  postgres_data:
    driver: local
  verdaccio_storage:
    driver: local
  verdaccio_conf:
    driver: local
  app_logs:
    driver: local